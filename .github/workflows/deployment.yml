name: Deployment storage and upgrade checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check standalone installer syntax
        run: bash -n install-trading.sh
      - name: Exercise isolated storage and upgrade fixtures
        run: sudo python3 -m unittest tests.test_install_storage tests.test_dashboard_build_workspace tests.test_trading_install -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real cold and incremental dashboard builds
        run: python3 tests/check_dashboard_workspace.py
